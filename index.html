<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Недвижимость — форма</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Добавление информации о недвижимости</h1>

    <form id="realtyForm">
        <!-- Вид недвижимости (радио) -->
        <fieldset>
            <legend>Вид недвижимости</legend>
            <label>
                <input type="radio" name="formType" value="Квартира"> Квартира
            </label>
            <label>
                <input type="radio" name="formType" value="Дом"> Дом
            </label>
            <label>
                <input type="radio" name="formType" value="Коммерческая"> Коммерческая
            </label>
        </fieldset>

        <!-- Этажность -->
        <label for="floors">Этажность:</label>
        <input type="number" id="floors" name="formFloors" min="1" placeholder="Например, 9">

        <!-- Площадь -->
        <label for="area">Площадь (м²):</label>
        <input type="number" id="area" name="formArea" min="0" step="0.1" placeholder="Например, 54.5">

        <!-- Стоимость -->
        <label for="price">Стоимость (руб.):</label>
        <input type="number" id="price" name="formPrice" min="0" placeholder="Например, 8500000">

        <!-- Местонахождение -->
        <label for="location">Местонахождение:</label>
        <input type="text" id="location" name="formLocation" placeholder="Город, улица, дом">

        <!-- Файл с фотографией -->
        <label for="photo">Фотография:</label>
        <input type="file" id="photo" name="formPhoto" accept="image/*">

        <!-- Ссылка на карту -->
        <label for="mapLink">Ссылка на место на карте:</label>
        <input type="url" id="mapLink" name="formMapLink" placeholder="https://maps.google.com/...">

        <div class="buttons">
            <button type="submit">Отправить</button>
            <button type="button" id="clearBtn">Очистить форму</button>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
